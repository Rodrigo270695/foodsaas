[program:foodsaas-reverb]
process_name=%(program_name)s
command=php /var/www/foodsaas/artisan reverb:start --host=0.0.0.0 --port=8082
directory=/var/www/foodsaas
autostart=true
autorestart=true
startretries=5
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/foodsaas/storage/logs/reverb.log
stopwaitsecs=10
stopasgroup=true
killasgroup=true
