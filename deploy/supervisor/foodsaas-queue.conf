[program:foodsaas-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/foodsaas/artisan queue:work --sleep=1 --tries=3 --max-time=3600
directory=/var/www/foodsaas
autostart=true
autorestart=true
startretries=5
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/foodsaas/storage/logs/queue.log
stopwaitsecs=3600
stopasgroup=true
killasgroup=true
